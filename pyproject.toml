[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantbox-engine"
version = "0.1.0"
description = "Strategy-agnostic crypto-futures backtest & execution engine (no-look-ahead, backtest/live parity)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["quant", "backtest", "trading", "binance", "futures", "execution"]
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Live execution talks to Binance USDT-M Futures; not needed for backtests.
live = ["python-binance>=1.0.29"]
dev = ["pytest>=8.0", "ruff==0.16.2", "python-binance>=1.0.29"]

[project.scripts]
qbe-backtest = "engine.backtest.vectorized:main"

[project.urls]
Repository = "https://github.com/younghwan91/quantbox-engine"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 룰셋을 명시한다 — ruff 기본 선택은 릴리스마다 넓어지므로, 그대로 두면 코드를 건드리지
# 않아도 CI가 갑자기 빨개진다(0.16에서 실제 발생). dev extra의 ruff 핀과 한 쌍이다.
select = ["E4", "E7", "E9", "F"]
